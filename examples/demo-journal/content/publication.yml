  # Scoreboard mât — un seul surnom maison pour tous les sports (comme le RSEQ :
  # une institution = un club, plusieurs formations). Code institution = SLHH.
  # Surnom : « Les Touladis ». Le touladi est le poisson du lac Témiscouata
  # et du Grand lac Touladi. « Les Élans » est le surnom réel du Cégep Garneau :
  # il n’est pas repris. Aucun club collégial du RSEQ ne s’appelle Touladis
  # (revue de rseq.ca, novembre 2026). Pas « Quorums ».
  # Adversaires = clubs RSEQ collégial ; scores/dates de calendrier.
  # Mobile : codes (SLHH vs SLA). Bureau : Touladis vs Barons (Champlain Saint-Lambert)
  # (maison sans parenthèse institution — évidente dans le journal du campus).
