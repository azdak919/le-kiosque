# Carte d'identité du journal. Le premier fichier que remplit une nouvelle
# équipe, et le seul qu'il faut relire à chaque passation.

slug: le-quorum
name: Le Quorum
tagline: On vote, on débat, on imprime
institution: Cégep du Quorum
institutionType: cegep
region: Québec
lang: fr-CA
siteUrl: https://journal-exemple.invalid
timeZone: America/Toronto

theme:
  # Reprend le pourpre de marque de LE-RADAR. Une équipe met ici la couleur
  # officielle de son établissement (voir brand-colors.json de LE-RADAR).
  accent: '#6c2163'
  accentDark: '#cf7ec1'
  typography: modern-accessible

# Libellés d’interface — verdict focus-group/decisions/le-kiosque-wire-title.json
# wireTitle = en-tête de la page d’accueil ; leadEyebrow = pastille sur la manchette.
labels:
  wireTitle: Le fil
  leadEyebrow: À la une

