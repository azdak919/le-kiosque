name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Check requis pour merger dans main (branch protection / ruleset) :
# le job s’appelle « test » — ne pas le renommer sans mettre à jour
# VisualCode/GIT-AND-TEST-SAFETY.md §9 et la protection GitHub.
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # Un dépôt créé avec « Use this template » porte un autre nom : on prend
      # le sous-chemin que GitHub Pages annonce, sans rien configurer.
      - if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Construire le site
        env:
          EVENT: ${{ github.event_name }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$EVENT" != pull_request ]; then export BASE="$PAGES_BASE"; fi
          npm run site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Navigateur après le build : n’empêche plus la publication Pages si un
  # sélecteur admin dérive (la vitrine statique est déjà validée par test).
  navigateur:
    name: navigateur
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: BASE=/autre-nom npm run site && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  publier:
    name: publier
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
