name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Check requis pour merger dans main (branch protection / ruleset) :
# le job s’appelle « test » — ne pas le renommer sans mettre à jour
# VisualCode/GIT-AND-TEST-SAFETY.md §9 et la protection GitHub.
#
# Ce workflow publie la VITRINE du Kiosque et Le Quorum. Il ne tourne que dans
# le dépôt amont : un journal créé avec « Use this template » ne publie que
# lui-même, par « Publier le journal » (publier.yml).
jobs:
  test:
    name: test
    if: github.repository == 'azdak919/le-kiosque'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: |
          set -euo pipefail
          n=1
          until npm ci; do
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "npm ci interrompu ($n/3), nouvel essai."
            sleep $((n * 5))
            n=$((n+1))
          done
      - name: PHP (installateur 0.2.1)
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - run: npm test
      # Le chemin publié est celui de kiosque.config.ts (racine du domaine
      # kiosque.le-radar.ca). On n’utilise pas le base_path annoncé par
      # configure-pages : tant que le domaine n’est pas enregistré dans les
      # réglages Pages, GitHub répond encore /le-kiosque et le site serait
      # reconstruit avec l’ancien sous-chemin.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Construire le site
        # Sans JavaScript, l’heure du match en cours est celle du build.
        # Montréal, pas UTC : un visiteur voit une heure cohérente.
        run: npm run site
        env:
          TZ: America/Toronto
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Navigateur après le build : n’empêche plus la publication Pages si un
  # sélecteur admin dérive (la vitrine statique est déjà validée par test).
  navigateur:
    name: navigateur
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Installer les dépendances
        run: |
          set -euo pipefail
          n=1
          until npm ci; do
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "npm ci interrompu ($n/3), nouvel essai."
            sleep $((n * 5))
            n=$((n+1))
          done
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          n=1
          until npx playwright install chromium; do
            if [ "$n" -ge 3 ]; then exit 1; fi
            echo "Installation de Chromium interrompue ($n/3), nouvel essai."
            sleep $((n * 5))
            n=$((n+1))
          done
      - name: Construire le site et lancer les tests navigateur
        run: BASE=/autre-nom npm run site && npx playwright test
        env:
          TZ: America/Toronto
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  publier:
    name: publier
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      # L'API Pages ne voit parfois pas encore l'artefact (« Found 0 artifact(s) »)
      # juste après l'envoi. Deux nouveaux essais, avec une pause. Chaque run
      # publie son propre SHA ; la concurrence annule un run plus ancien.
      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Pause avant un nouvel essai
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Déployer GitHub Pages (essai 2)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Pause avant le dernier essai
        if: steps.deployment2.outcome == 'failure'
        run: sleep 30
      - name: Déployer GitHub Pages (essai 3)
        id: deployment3
        if: steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5
