name: Essai CI en échec
# Ne part que lorsque ce fichier est poussé sur main, le temps de prouver
# l'issue. Il ne fait pas partie de la CI des pull requests.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/essai-ci-en-echec.yml
  workflow_dispatch:
    inputs:
      issue:
        description: echec ou vert
        required: true
        type: choice
        options:
          - echec
          - vert

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Retour au vert
        run: |
          echo "Retour au vert demandé pour prouver la fermeture de l'issue."
