name: CI en échec
# Signale l'échec d'un workflow sur main par une seule issue.
# Ce workflow n'est pas dans la liste `workflows` : il ne se déclenche pas lui-même.
# Le délai de deux minutes et le script sont dans le workflow appelé.
on:
  workflow_run:
    workflows:
      - "Dependabot fusion auto"
      - "Mise à jour de la plateforme"
      - "Mise à jour du socle"
      - "Paquet complet"
      - "Prochaine version"
      - "Publier une version"
      - "Publier le journal"
      - "Veille plateforme"
      - "Vérification"
    branches: [main]
    types: [completed]

permissions:
  issues: write
  actions: read

concurrency:
  group: ci-en-echec-appel-${{ github.repository }}
  cancel-in-progress: false

jobs:
  signaler:
    if: "github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.name != 'CI en échec' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure' || github.event.workflow_run.conclusion == 'success')"
    permissions:
      issues: write
      actions: read
    uses: ./.github/workflows/ci-en-echec.yml
    with:
      nom: ${{ github.event.workflow_run.name }}
      conclusion: ${{ github.event.workflow_run.conclusion }}
      url: ${{ github.event.workflow_run.html_url }}
      heure: ${{ github.event.workflow_run.updated_at }}
