name: Dependabot fusion auto
# Fusionne une PR Dependabot MINEURE ou CORRECTIVE seulement quand la
# Vérification (test + navigateur) est terminée et que tous les contrôles sont
# verts. Une majeure n'est jamais fusionnée ici : la veille la signale.
on:
  workflow_run:
    workflows: ["Vérification"]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: dependabot-automerge
  cancel-in-progress: false
jobs:
  fusion:
    if: github.repository == 'azdak919/le-kiosque' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Fusionner si mineure ou corrective
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number,headRefOid --jq ".[] | select(.headRefOid==\"$SHA\") | .number")
          [ -n "$pr" ] || { echo "Aucune PR ouverte pour $SHA"; exit 0; }
          states=$(gh pr view "$pr" -R "$REPO" --json statusCheckRollup --jq '[.statusCheckRollup[] | (.conclusion // .state // "PENDING")] | unique | join(",")')
          echo "Contrôles PR #$pr : $states"
          if echo "$states" | grep -Eqv '^(SUCCESS|SKIPPED|NEUTRAL)(,(SUCCESS|SKIPPED|NEUTRAL))*$'; then
            echo "Pas encore tout vert : on attend."; exit 0
          fi
          title=$(gh pr view "$pr" -R "$REPO" --json title --jq .title)
          case "$BRANCH" in
            *actions-mineures*|*npm-mineures*) kind=groupe ;;
            *)
              from=$(echo "$title" | sed -nE 's/.* from v?([0-9]+)\..* to v?([0-9]+)\..*/\1/p')
              to=$(echo "$title" | sed -nE 's/.* from v?([0-9]+)\..* to v?([0-9]+)\..*/\2/p')
              if [ -n "$from" ] && [ "$from" = "$to" ]; then kind=mineure; else kind=majeure; fi ;;
          esac
          echo "Type : $kind ($title)"
          [ "$kind" != majeure ] || { echo "Majeure : reste ouverte pour la veille."; exit 0; }
          gh pr merge "$pr" -R "$REPO" --squash --delete-branch

  # Dans un journal créé avec « Use this template » : Dependabot n'a rien à y
  # faire (les mises à jour arrivent par « Mise à jour de la plateforme »).
  # Le fichier .github/dependabot.yml est copié avec le gabarit et Dependabot
  # agit dès la création du dépôt ; on referme ses propositions et on retire
  # sa configuration, une fois pour toutes.
  journal:
    if: github.repository != 'azdak919/le-kiosque' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Refermer la proposition Dependabot et retirer sa configuration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          for pr in $(gh pr list -R "$REPO" --author 'app/dependabot' --state open --json number --jq '.[].number'); do
            gh pr close "$pr" -R "$REPO" --delete-branch --comment "Refermée automatiquement : dans un journal, les mises à jour arrivent par « Mise à jour de la plateforme »." || true
          done
          sha=$(gh api "repos/$REPO/contents/.github/dependabot.yml" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api -X DELETE "repos/$REPO/contents/.github/dependabot.yml" -f message="Dependabot retiré : réservé au dépôt du Kiosque" -f sha="$sha" >/dev/null
          fi
